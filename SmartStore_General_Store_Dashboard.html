/* SmartStore POS & Stock Management Theme */
*{box-sizing:border-box}body{margin:0;font:14px/1.4 "Segoe UI",Tahoma,Arial,sans-serif;background:#f3f6fb;color:#1e293b}

td{background:rgba(255,255,255,.65)}

/* ===== General Store billing dashboard layout ===== */
#sb{width:205px;min-width:205px}
#sb .lg{font-size:21px;line-height:1.15;padding:18px 15px}
#sb .lg:before{content:"💎";display:inline-block;margin-right:7px;color:#facc15}

#top{min-height:64px;background:linear-gradient(100deg,#071a45,#102c73 60%,#172554);color:#fff;padding:10px 18px}

#v{padding:16px 18px}
.db-welcome{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 13px}

.db-kpi:after{content:"";position:absolute;width:110px;height:110px;border:1px solid #ffffff35;border-radius:50%;right:-35px;top:-46px;box-shadow:0 0 0 12px #ffffff12,0 0 0 25px #ffffff0c}
.db-kpi span,.db-kpi small,.db-kpi b{position:relative;z-index:1;display:block;color:#fff!important}
.db-kpi span{font-size:11px;font-weight:700;opacity:.95}
.db-kpi b{font-size:clamp(16px,1.55vw,23px);margin:7px 0 4px;white-space:nowrap}
.db-kpi small{font-size:10px;opacity:.9}
.db-kpi i{position:absolute;right:13px;top:11px;font-style:normal;font-size:23px;opacity:.85}
.k-blue{background:linear-gradient(135deg,#1559d6,#168bff)}
.k-green{background:linear-gradient(135deg,#079b57,#18c878)}
.k-orange{background:linear-gradient(135deg,#e97808,#ffad21)}
.k-purple{background:linear-gradient(135deg,#6127ce,#9848f5)}
.k-pink{background:linear-gradient(135deg,#d71965,#f43f91)}
.k-cyan{background:linear-gradient(135deg,#0796aa,#13c4ce)}
.db-grid{display:grid;gap:12px;margin-bottom:12px;align-items:stretch}

.db-panel{min-width:0;padding:13px 14px;border-radius:14px;background:rgba(255,255,255,.93);border:1px solid #dce7f7;box-shadow:0 5px 15px rgba(28,55,105,.09)}

.db-panel table{border-spacing:0 2px}

.db-panel td{background:#fbfdff;color:#25375e}
.db-panel .b{font-size:10px;padding:5px 8px}
.db-sales-chart svg{display:block;width:100%;height:170px;overflow:visible}
.db-chart-legend{font-size:10px;color:#516487;margin:2px 0 0 4px}
.db-chart-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.lg-blue{background:#2677ff}
.db-stock-ring{display:flex;align-items:center;justify-content:center;gap:14px;min-height:155px}

.db-stock-legend{display:grid;gap:12px;min-width:0}
.db-stock-legend span{font-size:10px;color:#52627f;white-space:nowrap}
.db-stock-legend b{display:block;color:#1e3264;font-size:12px;margin:2px 0 0 15px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.d-green{background:#22c55e}.d-orange{background:#f59e0b}.d-blue{background:#2677ff}

.ic-green{background:#20bd69}.ic-orange{background:#f59e0b}.ic-blue{background:#3285f6}

.db-collection .db-total b{color:#159447;font-size:14px}
.db-alert{background:linear-gradient(145deg,#fff,#fff4f5);border-color:#ffd7df}
.db-alert .hd h3{color:#d62948}
.db-bars{height:125px;display:flex;align-items:flex-end;justify-content:space-around;gap:8px;padding:10px 5px 0;border-bottom:1px solid #dbe5f5}
.db-bar-col{height:100%;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.db-bar{width:min(25px,70%);min-height:4px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#17c879,#1685f8);box-shadow:0 3px 7px #1685f833}

.db-muted{font-size:10px;color:#8290a8}

@media(max-width:800px){#sb{width:100%;min-width:0}#top:before{display:none}.db-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.db-main-grid,.db-lower-grid,.db-bottom-grid{grid-template-columns:1fr}.db-main-grid .db-panel:last-child{grid-column:auto}.db-welcome h2{font-size:18px}.db-stock-ring{justify-content:flex-start}}

/* ===== POS side layout ===== */

function itemSalesData(){
 var from=$('#itemFrom')?$('#itemFrom').value:'',to=$('#itemTo')?$('#itemTo').value:'',query=$('#itemSearch')?$('#itemSearch').value.trim().toLowerCase():'';
 var map={};
 DB.sales.forEach(function(s){
  var date=dayKey(s.d);
  if(from&&date<from)return;if(to&&date>to)return;
  (s.items||[]).forEach(function(i){
   var name=i.n||i.name||'Unknown item',id=i.id==null?name:i.id;
   if(query&&name.toLowerCase().indexOf(query)<0)return;
   var key=String(id);
   if(!map[key])map[key]={name:name,qty:0,amount:0,transactions:0};
   map[key].qty+=(+i.q||+i.qty||0);
   map[key].amount+=(+i.p||+i.price||0)*(+i.q||+i.qty||0);
   map[key].transactions++;
  });
 });
 return Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.amount-a.amount});
}

 return '<section class="cd"><div class="hd"><h3>🧾 Product-wise (Item-wise) Sales Report</h3><button class="b t" onclick="itemSalesCSV()">Export CSV</button></div>'+
 '<div class="rg"><label>From date<input class="sq" id="itemFrom" type="date" value="'+h(from)+'" onchange="render()"/></label><label>To date<input class="sq" id="itemTo" type="date" value="'+h(to)+'" onchange="render()"/></label></div>'+
 '<label>Search product<input class="sq" id="itemSearch" type="search" placeholder="Enter product name" value="'+h($('#itemSearch')?$('#itemSearch').value:'')+'" oninput="itemSalesRefresh()"/></label>'+
 '<div class="g g5"><div class="st">Products Sold<b>'+rows.length+'</b></div><div class="st">Total Quantity<b>'+qty+'</b></div><div class="st">Item Sales Value<b>'+M(amount)+'</b></div></div>'+
 T(['Product / Item','Quantity Sold','Sales Amount','Average Unit Price'],rows.map(function(x){return[h(x.name),x.qty,M(x.amount),M(x.qty?x.amount/x.qty:0)]}))+
 (rows.length?'':'<p class="db-empty">No item sales found for the selected filters.</p>')+'</section>';
}
